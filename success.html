<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>予約完了</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <div class="topbar__title">
        <strong data-config="STORE_NAME">店舗名</strong>
        <span data-config="HEADER_SUBTITLE">予約受付</span>
      </div>
    </header>
    <section class="screen is-active">
      <div class="content">
        <article class="complete-card" id="resultCard">
          <div class="complete-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5l4.2 4.2L19.5 6.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 id="resultTitle">予約を確認しています</h2>
          <dl class="complete-summary" id="resultSummary">
            <div>
              <dt>状況</dt>
              <dd>決済結果を確認中です</dd>
            </div>
          </dl>
        </article>
      </div>
      <div class="fixed-action">
        <button class="secondary" type="button" onclick="location.href='index.html'">予約画面に戻る</button>
      </div>
    </section>
  </main>
  <script src="success.js"></script>
</body>
</html>
